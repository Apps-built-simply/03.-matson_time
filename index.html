<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Matson Time</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow" id="todayDate"></p>
        <h1>Today</h1>
      </div>
      <button class="icon-button" id="openAddButton" aria-label="Add an item">+</button>
    </header>

    <main>
      <section class="progress-summary" aria-labelledby="progressTitle">
        <div class="progress-ring" id="progressRing"><strong id="progressPercent">0%</strong></div>
        <div>
          <h2 id="progressTitle">Daily progress</h2>
          <p><strong id="completedCount">0</strong> completed · <strong id="remainingCount">0</strong> remaining</p>
        </div>
      </section>

      <section aria-labelledby="nowTitle">
        <div class="section-heading">
          <h2 id="nowTitle">What should I do now?</h2>
        </div>
        <div id="nowCard"></div>
      </section>

      <section aria-labelledby="scheduleTitle">
        <div class="section-heading">
          <h2 id="scheduleTitle">Today’s schedule</h2>
          <span id="scheduleCount" class="muted"></span>
        </div>
        <div id="conflictNotice" aria-live="polite"></div>
        <div id="scheduleList" class="schedule-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="today"><span>●</span>Today</button>
      <button class="nav-item" data-view="now"><span>◷</span>Now</button>
      <button class="nav-item" data-view="upcoming"><span>□</span>Upcoming</button>
      <button class="nav-item" data-view="assistant"><span>◇</span>Assistant</button>
      <button class="nav-item" data-view="progress"><span>▥</span>Progress</button>
    </nav>
  </div>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Create</p>
          <h2>Add new item</h2>
        </div>
        <button type="button" class="icon-button secondary" id="closeAddButton" aria-label="Close">×</button>
      </div>

      <label>Title<input name="title" required placeholder="What needs to be done?"></label>
      <label>Type
        <select name="type" id="itemType">
          <option value="activity">Scheduled activity</option>
          <option value="task">Untimed task</option>
          <option value="routine">Routine</option>
        </select>
      </label>
      <div class="form-row" id="timeFields">
        <label>Start time<input name="start" type="time"></label>
        <label>End time<input name="end" type="time"></label>
      </div>
      <label>Category
        <select name="category">
          <option>Music</option><option>Health</option><option>Personal</option><option>Meetings</option><option>Travel</option>
        </select>
      </label>
      <label>Notes<textarea name="notes" rows="3" placeholder="Optional notes"></textarea></label>
      <button class="primary-button" type="submit">Save item</button>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
